# 🧪 CI: install, build (VitePress fails the build on dead links) — on every PR and push to main
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: 📦 Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build
